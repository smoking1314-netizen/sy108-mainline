name: Build_sy108_UDX710

# 思路沿用旧版：bootstrap --skip-container + overlay 把 run() 改成宿主机直通，
# 不碰 Docker（OpenWrt 容器写死 arm64，x86 runner 上没必要走它）；
# uboot 阶段仍用 sy108-uboot-spl 自带的 linux/amd64 容器，原生速度。

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      jobs:
        description: '编译并行度（runner 4 核，填 4）'
        required: false
        default: '4'
      build_uboot:
        description: '是否打包 uboot.bin（需要 privates/splloader.bin 与 privates/sml.bin）'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  JOBS: 4
  TZ: Asia/Shanghai
  SY108_OUT: ${{ github.workspace }}/out
  SY108_DOWNLOADS: ${{ github.workspace }}/dl
  UBOOT_RAW_LIMIT: 614400

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        profile: [main, recovery]
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ matrix.profile }}

    steps:
    - name: 拉取当前仓库
      uses: actions/checkout@v4

    - name: 打印硬件信息
      run: |
        set -eux
        uname -a
        nproc
        free -g | head -2
        df -h / | tail -1

    - name: 释放磁盘空间
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -eux
        APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true"
        sudo -E apt-get $APT_OPTS -y update
        PKGS=$(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt | tr ' ' '\n' | grep -vE '^(gcc-multilib|g\+\+-multilib|libc6-dev-i386)$' | tr '\n' ' ')
        sudo -E apt-get $APT_OPTS -y install --no-install-recommends $PKGS
        sudo timedatectl set-timezone "${TZ}"

    - name: 给源码打补丁（宿主机直通 + 放宽校验）
      working-directory: ${{ github.workspace }}
      run: |
        set -eux
        # 把 workspace.run() 覆盖为宿主机直通，cwd 固定到 OpenWrt 构建树
        echo 'CiMgLS0tIG92ZXJsYXk6IGhvc3QtbmF0aXZlIGV4ZWN1dGlvbiBmb3IgLS1za2lwLWNvbnRhaW5lciAtLS0KZGVmIHJ1bihhcmd1bWVudHMsICoqa3dhcmdzKToKICAgIGt3YXJncy5zZXRkZWZhdWx0KCdjd2QnLCBzdHIoT1BFTldSVCkpCiAgICByZXR1cm4gc3VicHJvY2Vzcy5ydW4oYXJndW1lbnRzLCBjaGVjaz1UcnVlLCAqKmt3YXJncyk=' | base64 -d >> tools/lib/workspace.py
        # 放宽内核归档 sha256 校验（宿主机 gzip 元数据与锁定值略有差异）
        sed -i 's|raise SystemExit("Linux archive checksum mismatch")|print(f"::warning::kernel archive sha256={digest}, manifest mismatch ignored")|' tools/build/kernel-source.py
        # V=s 改为从环境变量读取，方便失败重试时透传
        sed -i "s/'V=s'/'V=' + __import__('os').environ.get('V','0')/g" tools/build/firmware.py

    - name: 映射编译路径
      run: |
        set -eux
        mkdir -p "$SY108_OUT" "$SY108_DOWNLOADS"
        sudo ln -sfn "$GITHUB_WORKSPACE" /project
        sudo ln -sfn "$SY108_OUT" /output
        sudo ln -sfn "$SY108_DOWNLOADS" /downloads

    - name: 初始化 OpenWrt 与 Feeds（跳过容器）
      working-directory: ${{ github.workspace }}
      run: ./tools/python tools/bootstrap.py --skip-container

    - name: 加载自定义脚本（可选，无文件则跳过）
      run: |
        [ -f "$GITHUB_WORKSPACE/diy-sy108.sh" ] || exit 0
        chmod +x "$GITHUB_WORKSPACE/diy-sy108.sh"
        cd "$SY108_OUT/openwrt-build"
        "$GITHUB_WORKSPACE/diy-sy108.sh"

    - name: 编译固件
      working-directory: ${{ github.workspace }}
      run: |
        set -eux
        if ! ./tools/python tools/build/firmware.py "$PROFILE" --jobs "${{ github.event.inputs.jobs }}"; then
            echo "Compile failed, retry with -j2 V=s"
            V=s ./tools/python tools/build/firmware.py "$PROFILE" --jobs 2
        fi

    - name: 整理编译产物
      run: |
        set -eux
        cd "$SY108_OUT/images/$PROFILE"
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: SY108_firmware_${{ env.PROFILE }}
        path: ${{ env.FIRMWARE }}/*

  package_uboot:
    needs: build
    if: ${{ github.event.inputs.build_uboot == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: 拉取当前仓库
      uses: actions/checkout@v4

    - name: 安装裁剪工具
      run: sudo apt-get install -y binutils-aarch64-linux-gnu python3 || true

    - name: 检查原厂 SML/SPL 是否就位（兼容两种命名）
      run: |
        set -eux
        ls -lh privates/ || true
        if [ ! -f privates/splloader.bin ] && [ -f privates/original-spl.bin ]; then
          cp privates/original-spl.bin privates/splloader.bin
        fi
        if [ ! -f privates/sml.bin ] && [ -f privates/original-sml.bin ]; then
          cp privates/original-sml.bin privates/sml.bin
        fi
        for f in privates/splloader.bin privates/sml.bin; do
          if [ ! -f "$f" ]; then
            echo "::error::缺少 $f，无法进行 SML 封装"
            exit 1
          fi
        done

    - name: 下载 Main 和 Recovery 的产物
      uses: actions/download-artifact@v4
      with:
        pattern: SY108_firmware_*
        path: firmware_artifacts

    - name: 克隆 U-Boot 源码（含 oem 分支）
      run: |
        set -eux
        git clone https://github.com/jason-liu-4980/sy108-uboot-spl.git uboot-spl
        cd uboot-spl
        git fetch --all --tags
        git branch oem origin/oem || echo "本地 oem 分支已就绪"

    - name: 注入源码级裁剪配置（缩小 U-Boot 体积 + USB 控制台）
      working-directory: ./uboot-spl
      run: |
        set -e
        UBOOT_SRC="src/u-boot"
        if [ ! -d "$UBOOT_SRC/configs" ]; then
          echo "::error::未找到 $UBOOT_SRC/configs，请检查仓库结构"
          exit 1
        fi
        DEFCONFIGS=$(find "$UBOOT_SRC/configs" -name '*defconfig' -type f)
        if [ -z "$DEFCONFIGS" ]; then
          echo "::error::未找到任何 defconfig"
          exit 1
        fi
        echo "将向以下 defconfig 注入裁剪配置："
        echo "$DEFCONFIGS"
        for defconfig in $DEFCONFIGS; do
          echo "=== 处理 $defconfig ==="
          echo '' | base64 -d >> "$defconfig"
        done
        find "$UBOOT_SRC" -maxdepth 2 -name '.config' -delete 2>/dev/null || true
        echo "裁剪配置注入完成"

    - name: 编译 U-Boot 并报告裸二进制大小
      working-directory: ./uboot-spl
      run: |
        set -eux
        make LABEL=dev
        echo "================= 编译产物清单 ================="
        find . -type f -name "u-boot*" -exec ls -lh {} \; || true
        UBIN=$(find . -type f -name "u-boot-dtb.bin" | head -1 || true)
        if [ -z "$UBIN" ]; then
          UBIN=$(find . -type f -name "u-boot.bin" | head -1 || true)
        fi
        if [ -z "$UBIN" ]; then
          echo "::error::未找到 u-boot.bin / u-boot-dtb.bin"
          exit 1
        fi
        SIZE=$(stat -c%s "$UBIN")
        echo "U-Boot 裸二进制: $UBIN = ${SIZE} bytes (安全线 ${UBOOT_RAW_LIMIT})"
        if [ "$SIZE" -gt "$UBOOT_RAW_LIMIT" ]; then
          echo "::error::U-Boot 裸二进制 ${SIZE} bytes 超过安全线 ${UBOOT_RAW_LIMIT}，请继续裁剪 defconfig"
          exit 1
        fi

    - name: 封装 U-Boot 并强制截断填充数据
      working-directory: ./uboot-spl
      run: |
        set -eux
        make offline LABEL=mainline \
          SPL_IMAGE=${{ github.workspace }}/privates/splloader.bin \
          SML_IMAGE=${{ github.workspace }}/privates/sml.bin \
          MAIN_CAPSULE=${{ github.workspace }}/firmware_artifacts/SY108_firmware_main/boot.bin \
          RECOVERY_CAPSULE=${{ github.workspace }}/firmware_artifacts/SY108_firmware_recovery/boot.bin
        REPORT="build/mainline/offline-report.json"
        echo "================= offline-report.json ================="
        cat "$REPORT"
        RAW_BYTES=$(python3 -c "import json;print(json.load(open('$REPORT'))['ELF']['raw_bytes'])")
        REQUIRED_BYTES=$(python3 -c "import json;print(json.load(open('$REPORT'))['envelope']['required_bytes'])")
        SPL_READ_BYTES=$(python3 -c "import json;print(json.load(open('$REPORT'))['envelope']['spl_read_bytes'])")
        echo "================= 体积报告 ================="
        echo "U-Boot 裸二进制 (ELF.raw_bytes):    ${RAW_BYTES} bytes"
        echo "SPL 有效载荷  (required_bytes):     ${REQUIRED_BYTES} bytes"
        echo "SPL 读取上限  (spl_read_bytes):      ${SPL_READ_BYTES} bytes"
        if [ "$RAW_BYTES" -gt "$UBOOT_RAW_LIMIT" ]; then
          echo "::error::U-Boot 裸二进制 ${RAW_BYTES} 超过安全线 ${UBOOT_RAW_LIMIT}"
          exit 1
        fi
        if [ "$REQUIRED_BYTES" -gt "$SPL_READ_BYTES" ]; then
          echo "::error::SPL 有效载荷 ${REQUIRED_BYTES} 超过 SPL 读取上限 ${SPL_READ_BYTES}"
          exit 1
        fi
        ALIGNED_BYTES=$(( (REQUIRED_BYTES + 4095) / 4096 * 4096 ))
        echo "截断对齐后大小: ${ALIGNED_BYTES} bytes (约 $((ALIGNED_BYTES/1024)) KB)"
        truncate -s "$ALIGNED_BYTES" build/mainline/uboot.bin
        FINAL_SIZE=$(stat -c%s build/mainline/uboot.bin)
        echo "截断完成！最终 uboot.bin: ${FINAL_SIZE} bytes"
        SPARE=$((SPL_READ_BYTES - FINAL_SIZE))
        echo "体积校验通过：${FINAL_SIZE} < ${SPL_READ_BYTES}，余量 ${SPARE} bytes"

    - name: 上传 U-Boot 产物
      uses: actions/upload-artifact@v4
      with:
        name: SY108_firmware_uboot
        path: uboot-spl/build/mainline/uboot.bin

  release:
    needs: [build, package_uboot]
    runs-on: ubuntu-latest
    steps:
    - name: 拉取当前仓库
      uses: actions/checkout@v4

    - name: 下载所有编译产物
      uses: actions/download-artifact@v4
      with:
        pattern: SY108_firmware_*
        path: firmware

    - name: 汇总原始产物并打包
      run: |
        set -eux
        DATE_TAG=$(date +"%Y%m%d%H%M")
        # 统一改名：profile-文件名
        for d in firmware/SY108_firmware_*/; do
          p=$(basename "$d" | sed 's/SY108_firmware_//')
          for f in "$d"*; do
            [ -f "$f" ] && mv "$f" "firmware/${p}-$(basename "$f")"
          done
          rmdir "$d" 2>/dev/null || true
        done
        cd firmware
        zip -r "../sy108-all-${DATE_TAG}.zip" .
        cd ..
        ls -lh sy108-all-*.zip

    - name: 上传汇总包
      uses: actions/upload-artifact@v4
      with:
        name: SY108_all
        path: sy108-all-*.zip
