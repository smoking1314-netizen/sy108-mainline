name: Build SY108 OpenWrt

# 用法：把本文件放到你自己 fork 的 sy108-mainline 仓库的
#        .github/workflows/build.yml
# 然后到 Actions 页面点 "Run workflow"。

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: '编译并行度（GitHub runner 是 4 核，填 4）'
        required: false
        default: '4'
      build_uboot:
        description: '是否打包 uboot.bin（需要本仓库 privates/original-spl.bin 与 privates/original-sml.bin）'
        type: boolean
        required: false
        default: false

env:
  # fork 之后所有仓库都在你自己的账号下
  OWNER: ${{ github.repository_owner }}
  UPSTREAM_OWNER: jason-liu-4980
  # 内核锁定的提交，与 manifests/kernel.json 一致
  KERNEL_COMMIT: 14658d97220a06e34976d703e167073462390c78

jobs:
  build:
    name: main + recovery + uboot
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: 取出本仓库（sy108-mainline 的 fork，含 privates/）
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          set -eux
          echo "owner = $OWNER"
          nproc; free -g | head -2; df -h / | tail -1
          python3 --version; git --version
          docker version --format 'server {{.Server.Version}}  arch {{.Server.Arch}}'
          echo '--- 私密件检查 ---'
          ls -l privates/ 2>/dev/null || echo "(没有 privates/ 目录)"
          test -f privates/original-spl.bin && echo "spl ok $(stat -c%s privates/original-spl.bin)"
          test -f privates/original-sml.bin && echo "sml ok $(stat -c%s privates/original-sml.bin)" || true
          echo '--- kernel.json 锁定值 ---'
          cat manifests/kernel.json

      - name: 准备内核源码（优先你自己的 fork，缺提交就回退上游）
        run: |
          set -eux
          KDIR="$GITHUB_WORKSPACE/../linux-udx710"
          rm -rf "$KDIR"
          for URL in "https://github.com/$OWNER/linux-udx710.git" \
                     "https://github.com/$UPSTREAM_OWNER/linux-udx710.git"; do
            echo "尝试 $URL"
            rm -rf "$KDIR"; mkdir -p "$KDIR"
            if git -C "$KDIR" init -q \
               && git -C "$KDIR" remote add origin "$URL" \
               && git -C "$KDIR" fetch -q --depth 1 --no-tags origin "$KERNEL_COMMIT" \
               && git -C "$KDIR" checkout -q --detach "$KERNEL_COMMIT"; then
              echo "OK 从 $URL 拿到 $KERNEL_COMMIT"
              break
            fi
            rm -rf "$KDIR"
          done
          test -d "$KDIR/.git" || { echo "::error::两个来源都拿不到内核提交"; exit 1; }
          git -C "$KDIR" rev-parse HEAD
          test "$(git -C "$KDIR" rev-parse HEAD)" = "$KERNEL_COMMIT" || { echo "::error::内核提交不匹配"; exit 1; }

      - name: 拉取 sy108-uboot-spl 的 fork
        run: |
          set -eux
          UDIR="$GITHUB_WORKSPACE/../sy108-uboot-spl"
          rm -rf "$UDIR"
          git clone --depth 1 "https://github.com/$OWNER/sy108-uboot-spl.git" "$UDIR" \
            || git clone --depth 1 "https://github.com/$UPSTREAM_OWNER/sy108-uboot-spl.git" "$UDIR"
          git -C "$UDIR" log -1 --format='%H %s'

      - name: 把容器平台改成 amd64（关键，否则全程 QEMU 模拟）
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          echo '--- 命中文件 ---'
          grep -rl --exclude-dir=.git 'linux/arm64' tools/ || true
          grep -rl --exclude-dir=.git 'linux/arm64' tools/ | xargs -r sed -i 's|linux/arm64|linux/amd64|g'
          echo '--- 改后应无输出 ---'
          grep -rn --exclude-dir=.git 'linux/arm64' tools/ || true

      - name: bootstrap（建镜像 + 拉 OpenWrt + 打补丁 + feeds）
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          export SY108_PYTHON=python3
          export SY108_JOBS="${{ github.event.inputs.jobs }}"
          export SY108_MEMORY=8g
          sh tools/python tools/bootstrap.py

      - name: 编译 main
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          export SY108_PYTHON=python3 SY108_JOBS="${{ github.event.inputs.jobs }}" SY108_MEMORY=8g
          sh tools/python tools/build/firmware.py main --jobs "${{ github.event.inputs.jobs }}"

      - name: 编译 recovery
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          export SY108_PYTHON=python3 SY108_JOBS="${{ github.event.inputs.jobs }}" SY108_MEMORY=8g
          sh tools/python tools/build/firmware.py recovery --jobs "${{ github.event.inputs.jobs }}"

      - name: 打包 uboot.bin
        if: ${{ github.event.inputs.build_uboot == 'true' }}
        run: |
          set -eux
          SPL="$GITHUB_WORKSPACE/privates/original-spl.bin"
          SML="$GITHUB_WORKSPACE/privates/original-sml.bin"
          if [ ! -f "$SPL" ] || [ ! -f "$SML" ]; then
            echo "::error::uboot 必须用本机 spl/sml 签名封装，缺 privates/original-spl.bin 或 original-sml.bin"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/../sy108-uboot-spl"
          make offline LABEL=mainline \
            SPL_IMAGE="$SPL" \
            SML_IMAGE="$SML" \
            MAIN_CAPSULE="$GITHUB_WORKSPACE/out/images/main/boot.bin" \
            RECOVERY_CAPSULE="$GITHUB_WORKSPACE/out/images/recovery/boot.bin"
          ls -l build/mainline/
          cp -v build/mainline/uboot.bin "$GITHUB_WORKSPACE/out/images/uboot.bin"

      - name: 汇总产物
        if: always()
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/out/images" 2>/dev/null || exit 0
          echo '=== main ===';     ls -lh main/ 2>/dev/null || true
          echo '=== recovery ==='; ls -lh recovery/ 2>/dev/null || true
          echo '=== uboot ===';    ls -lh uboot.bin 2>/dev/null || true
          {
            echo "## SY108 构建产物"
            echo
            echo '```'
            find . -type f -printf '%-46p %8s B\n' 2>/dev/null | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sy108-firmware
          path: |
            out/images/main/*
            out/images/recovery/*
            out/images/uboot.bin
            out/images/main/build.json
          if-no-files-found: warn
          retention-days: 30
